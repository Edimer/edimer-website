<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Línea vertical base -->
  <line x1="100" y1="50" x2="100" y2="950" stroke="#333" stroke-width="2"/>

  <!-- 1957 - Fortran -->
  <circle cx="100" cy="100" r="8" fill="#286343"/>
  <text x="60" y="105" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1957</text>
  <line x1="108" y1="100" x2="300" y2="100" stroke="#666" stroke-width="1"/>
  <rect x="300" y="70" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="95" font-family="Arial" font-size="12" fill="#333">FORTRAN: Primer lenguaje de programación de alto nivel</text>
  <text x="320" y="115" font-family="Arial" font-size="12" fill="#666">Revoluciona la programación científica</text>

  <!-- 1962 - SAS -->
  <circle cx="100" cy="200" r="8" fill="#286343"/>
  <text x="60" y="205" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1962</text>
  <line x1="108" y1="200" x2="300" y2="200" stroke="#666" stroke-width="1"/>
  <rect x="300" y="170" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="195" font-family="Arial" font-size="12" fill="#333">SAS: Statistical Analysis System</text>
  <text x="320" y="215" font-family="Arial" font-size="12" fill="#666">Primer software estadístico integrado</text>

  <!-- 1976 - Apple -->
  <circle cx="100" cy="300" r="8" fill="#286343"/>
  <text x="60" y="305" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1976</text>
  <line x1="108" y1="300" x2="300" y2="300" stroke="#666" stroke-width="1"/>
  <rect x="300" y="270" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="295" font-family="Arial" font-size="12" fill="#333">Fundación de Apple Computer</text>
  <text x="320" y="315" font-family="Arial" font-size="12" fill="#666">Inicio de la era de la computación personal</text>

  <!-- 1981 - IBM PC -->
  <circle cx="100" cy="400" r="8" fill="#286343"/>
  <text x="60" y="405" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1981</text>
  <line x1="108" y1="400" x2="300" y2="400" stroke="#666" stroke-width="1"/>
  <rect x="300" y="370" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="395" font-family="Arial" font-size="12" fill="#333">IBM PC: Computadora Personal</text>
  <text x="320" y="415" font-family="Arial" font-size="12" fill="#666">Estandarización de la computación personal</text>

  <!-- 1991 - Python -->
  <circle cx="100" cy="500" r="8" fill="#286343"/>
  <text x="60" y="505" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1991</text>
  <line x1="108" y1="500" x2="300" y2="500" stroke="#666" stroke-width="1"/>
  <rect x="300" y="470" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="495" font-family="Arial" font-size="12" fill="#333">Python: Guido van Rossum</text>
  <text x="320" y="515" font-family="Arial" font-size="12" fill="#666">Lenguaje de programación de propósito general</text>

  <!-- 1993 - WWW -->
  <circle cx="100" cy="600" r="8" fill="#286343"/>
  <text x="60" y="605" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1993</text>
  <line x1="108" y1="600" x2="300" y2="600" stroke="#666" stroke-width="1"/>
  <rect x="300" y="570" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="595" font-family="Arial" font-size="12" fill="#333">World Wide Web se hace público</text>
  <text x="320" y="615" font-family="Arial" font-size="12" fill="#666">Inicio de la era de Internet</text>

  <!-- 1993 - R -->
  <circle cx="100" cy="700" r="8" fill="#286343"/>
  <text x="60" y="705" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1993</text>
  <line x1="108" y1="700" x2="300" y2="700" stroke="#666" stroke-width="1"/>
  <rect x="300" y="670" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="695" font-family="Arial" font-size="12" fill="#333">R: Ihaka y Gentleman</text>
  <text x="320" y="715" font-family="Arial" font-size="12" fill="#666">Lenguaje para análisis estadístico y gráficos</text>

  <!-- 2000 - Proyecto Genoma -->
  <circle cx="100" cy="800" r="8" fill="#286343"/>
  <text x="60" y="805" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2000</text>
  <line x1="108" y1="800" x2="300" y2="800" stroke="#666" stroke-width="1"/>
  <rect x="300" y="770" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="795" font-family="Arial" font-size="12" fill="#333">Primer borrador del Genoma Humano</text>
  <text x="320" y="815" font-family="Arial" font-size="12" fill="#666">Inicio de la era genómica</text>

  <!-- 2001 - Bioconductor -->
  <circle cx="100" cy="900" r="8" fill="#286343"/>
  <text x="60" y="905" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2001</text>
  <line x1="108" y1="900" x2="300" y2="900" stroke="#666" stroke-width="1"/>
  <rect x="300" y="870" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="895" font-family="Arial" font-size="12" fill="#333">Bioconductor</text>
  <text x="320" y="915" font-family="Arial" font-size="12" fill="#666">Software para análisis de datos genómicos</text>
</svg>