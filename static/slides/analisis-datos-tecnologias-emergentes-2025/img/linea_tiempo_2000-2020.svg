<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <!-- Línea vertical base -->
  <line x1="100" y1="50" x2="100" y2="850" stroke="#286343" stroke-width="2"/>

  <!-- 2004 - Web 2.0 -->
  <circle cx="100" cy="80" r="8" fill="#286343"/>
  <text x="60" y="85" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2004</text>
  <line x1="108" y1="80" x2="300" y2="80" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="50" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="75" font-family="Arial" font-size="12" fill="#333">Web 2.0 y Redes Sociales</text>
  <text x="320" y="95" font-family="Arial" font-size="12" fill="#666">Facebook y la era de los datos sociales</text>

  <!-- 2006 - Hadoop -->
  <circle cx="100" cy="155" r="8" fill="#286343"/>
  <text x="60" y="160" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2006</text>
  <line x1="108" y1="155" x2="300" y2="155" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="125" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="150" font-family="Arial" font-size="12" fill="#333">Apache Hadoop</text>
  <text x="320" y="170" font-family="Arial" font-size="12" fill="#666">Framework para procesamiento distribuido</text>

  <!-- 2009 - Spark -->
  <circle cx="100" cy="230" r="8" fill="#286343"/>
  <text x="60" y="235" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2009</text>
  <line x1="108" y1="230" x2="300" y2="230" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="200" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="225" font-family="Arial" font-size="12" fill="#333">Apache Spark</text>
  <text x="320" y="245" font-family="Arial" font-size="12" fill="#666">Procesamiento de datos en memoria y tiempo real</text>

  <!-- 2009 - ImageNet -->
  <circle cx="100" cy="305" r="8" fill="#286343"/>
  <text x="60" y="310" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2009</text>
  <line x1="108" y1="305" x2="300" y2="305" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="275" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="300" font-family="Arial" font-size="12" fill="#333">ImageNet</text>
  <text x="320" y="320" font-family="Arial" font-size="12" fill="#666">Base de datos de imágenes para visión por computador</text>

  <!-- 2009 - NoSQL -->
  <circle cx="100" cy="380" r="8" fill="#286343"/>
  <text x="60" y="385" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2009</text>
  <line x1="108" y1="380" x2="300" y2="380" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="350" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="375" font-family="Arial" font-size="12" fill="#333">Auge de NoSQL</text>
  <text x="320" y="395" font-family="Arial" font-size="12" fill="#666">MongoDB y bases de datos no relacionales</text>

  <!-- 2012 - Deep Learning -->
  <circle cx="100" cy="455" r="8" fill="#286343"/>
  <text x="60" y="460" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2012</text>
  <line x1="108" y1="455" x2="300" y2="455" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="425" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="450" font-family="Arial" font-size="12" fill="#333">Revolución del Deep Learning</text>
  <text x="320" y="470" font-family="Arial" font-size="12" fill="#666">AlexNet y redes neuronales profundas</text>

  <!-- 2015 - TensorFlow -->
  <circle cx="100" cy="530" r="8" fill="#286343"/>
  <text x="60" y="535" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2015</text>
  <line x1="108" y1="530" x2="300" y2="530" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="500" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="525" font-family="Arial" font-size="12" fill="#333">TensorFlow de Google</text>
  <text x="320" y="545" font-family="Arial" font-size="12" fill="#666">Democratización del deep learning</text>

  <!-- 2016 - AlphaGo -->
  <circle cx="100" cy="605" r="8" fill="#286343"/>
  <text x="60" y="610" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2016</text>
  <line x1="108" y1="605" x2="300" y2="605" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="575" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="600" font-family="Arial" font-size="12" fill="#333">AlphaGo vence a Lee Sedol</text>
  <text x="320" y="620" font-family="Arial" font-size="12" fill="#666">IA supera al humano en Go</text>

  <!-- 2017 - Transformer -->
  <circle cx="100" cy="680" r="8" fill="#286343"/>
  <text x="60" y="685" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2017</text>
  <line x1="108" y1="680" x2="300" y2="680" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="650" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="675" font-family="Arial" font-size="12" fill="#333">Transformers: "Attention is All You Need"</text>
  <text x="320" y="695" font-family="Arial" font-size="12" fill="#666">Nueva arquitectura para procesamiento secuencial</text>

  <!-- 2018 - BERT -->
  <circle cx="100" cy="755" r="8" fill="#286343"/>
  <text x="60" y="760" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2018</text>
  <line x1="108" y1="755" x2="300" y2="755" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="725" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="750" font-family="Arial" font-size="12" fill="#333">BERT de Google</text>
  <text x="320" y="770" font-family="Arial" font-size="12" fill="#666">Revolución en procesamiento de lenguaje natural</text>

  <!-- 2020 - GPT-3 -->
  <circle cx="100" cy="830" r="8" fill="#286343"/>
  <text x="60" y="835" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">2020</text>
  <line x1="108" y1="830" x2="300" y2="830" stroke="#286343" stroke-width="1"/>
  <rect x="300" y="800" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="825" font-family="Arial" font-size="12" fill="#333">GPT-3 de OpenAI</text>
  <text x="320" y="845" font-family="Arial" font-size="12" fill="#666">Modelo de lenguaje de 175 mil millones de parámetros</text>
</svg>