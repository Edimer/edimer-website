<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Círculos principales -->
  <circle cx="350" cy="250" r="180" fill="#ff00004d" stroke="#ff0000" stroke-width="2"/>
  <circle cx="500" cy="250" r="180" fill="#0000ff4d" stroke="#0000ff" stroke-width="2"/>
  <circle cx="425" cy="400" r="180" fill="#00ff004d" stroke="#00ff00" stroke-width="2"/>
  
  <!-- Textos principales -->
  <text x="220" y="200" font-family="Arial" font-size="16" fill="#000">Matemáticas/</text>
  <text x="220" y="220" font-family="Arial" font-size="16" fill="#000">Estadística</text>
  <text x="580" y="200" font-family="Arial" font-size="16" fill="#000">Computación</text>
  <text x="425" y="550" font-family="Arial" font-size="16" fill="#000" text-anchor="middle">Dominio del</text>
  <text x="425" y="570" font-family="Arial" font-size="16" fill="#000" text-anchor="middle">Conocimiento</text>
  
  <!-- Software (movido arriba) -->
  <text x="580" y="250" font-family="Arial" font-size="14" fill="#000">Software</text>
  <text x="580" y="270" font-family="Arial" font-size="12" fill="#444">• Bases de datos</text>
  <text x="580" y="290" font-family="Arial" font-size="12" fill="#444">• Programación</text>
  
  <!-- Inteligencia Artificial -->
  <text x="425" y="140" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">Inteligencia Artificial</text>
  <text x="425" y="160" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">• Redes Neuronales</text>
  <text x="425" y="180" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">• Aprendizaje Profundo</text>
  <text x="425" y="200" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">• Sistemas Expertos</text>
  
  <!-- Machine Learning -->
  <text x="425" y="250" font-family="Arial" font-size="14" fill="#000" text-anchor="middle">Machine Learning</text>
  <text x="425" y="270" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">• Algoritmos predictivos</text>
  <text x="425" y="290" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">• Modelos supervisados/no supervisados</text>
  
  <!-- Centro - Ciencia de Datos -->
  <text x="425" y="350" font-family="Arial" font-size="18" font-weight="bold" fill="#000" text-anchor="middle">Ciencia de Datos</text>
  
