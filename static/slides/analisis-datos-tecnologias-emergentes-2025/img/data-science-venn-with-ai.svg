  <text x="270" y="440" font-family="Arial" font-size="12" fill="#444">• Análisis estadístico</text>
  
  <!-- Elementos específicos en cada campo -->
  <text x="200" y="150" font-family="Arial" font-size="12" fill="#444">• Probabilidad</text>
  <text x="200" y="170" font-family="Arial" font-size="12" fill="#444">• Inferencia</text>
  
  <text x="600" y="150" font-family="Arial" font-size="12" fill="#444">• Estructuras de datos</text>
  <text x="600" y="170" font-family="Arial" font-size="12" fill="#444">• Algoritmos</text>
  
  <text x="425" y="500" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">• Conocimiento del área</text>
  <text x="425" y="520" font-family="Arial" font-size="12" fill="#444" text-anchor="middle">• Contexto del problema</text>
