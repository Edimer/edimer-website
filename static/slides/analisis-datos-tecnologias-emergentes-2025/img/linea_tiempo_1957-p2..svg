<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Línea vertical base -->
  <line x1="100" y1="50" x2="100" y2="750" stroke="#333" stroke-width="2"/>

  <!-- 1933 Hotelling -->
  <circle cx="100" cy="100" r="8" fill="#286343"/>
  <text x="60" y="105" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1933</text>
  <line x1="108" y1="100" x2="300" y2="100" stroke="#666" stroke-width="1"/>
  <rect x="300" y="70" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="95" font-family="Arial" font-size="12" fill="#333">Hotelling: T² y PCA</text>
  <text x="320" y="115" font-family="Arial" font-size="12" fill="#666">Análisis multivariado y reducción de dimensiones</text>

  <!-- 1934 Neyman -->
  <circle cx="100" cy="200" r="8" fill="#286343"/>
  <text x="60" y="205" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1934</text>
  <line x1="108" y1="200" x2="300" y2="200" stroke="#666" stroke-width="1"/>
  <rect x="300" y="170" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="195" font-family="Arial" font-size="12" fill="#333">Jerzy Neyman: Intervalos de Confianza</text>
  <text x="320" y="215" font-family="Arial" font-size="12" fill="#666">Fundamentos de la inferencia por intervalos</text>

  <!-- 1935 Fisher DOE -->
  <circle cx="100" cy="300" r="8" fill="#286343"/>
  <text x="60" y="305" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1935</text>
  <line x1="108" y1="300" x2="300" y2="300" stroke="#666" stroke-width="1"/>
  <rect x="300" y="270" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="295" font-family="Arial" font-size="12" fill="#333">R.A. Fisher: The Design of Experiments</text>
  <text x="320" y="315" font-family="Arial" font-size="12" fill="#666">Principios fundamentales del diseño experimental</text>

  <!-- 1939 Fisher -->
  <circle cx="100" cy="400" r="8" fill="#286343"/>
  <text x="60" y="405" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1939</text>
  <line x1="108" y1="400" x2="300" y2="400" stroke="#666" stroke-width="1"/>
  <rect x="300" y="370" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="395" font-family="Arial" font-size="12" fill="#333">Fisher: Análisis Discriminante</text>
  <text x="320" y="415" font-family="Arial" font-size="12" fill="#666">Clasificación estadística y "machine learning temprano"</text>

  <!-- 1944 ENIAC -->
  <circle cx="100" cy="500" r="8" fill="#c64654"/>
  <text x="60" y="505" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1944</text>
  <line x1="108" y1="500" x2="300" y2="500" stroke="#666" stroke-width="1"/>
  <rect x="300" y="470" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#c64654"/>
  <text x="320" y="495" font-family="Arial" font-size="12" fill="#333">ENIAC: Primera Computadora Programable</text>
  <text x="320" y="515" font-family="Arial" font-size="12" fill="#666">Revolución en cálculos estadísticos complejos</text>

  <!-- 1951 Box -->
  <circle cx="100" cy="600" r="8" fill="#286343"/>
  <text x="60" y="605" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1951</text>
  <line x1="108" y1="600" x2="300" y2="600" stroke="#666" stroke-width="1"/>
  <rect x="300" y="570" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="595" font-family="Arial" font-size="12" fill="#333">Box y Wilson: Metodología de Superficie de Respuesta</text>
  <text x="320" y="615" font-family="Arial" font-size="12" fill="#666">Optimización experimental y diseños factoriales</text>

  <!-- 1957 Tukey -->
  <circle cx="100" cy="700" r="8" fill="#286343"/>
  <text x="60" y="705" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1957</text>
  <line x1="108" y1="700" x2="300" y2="700" stroke="#666" stroke-width="1"/>
  <rect x="300" y="670" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="695" font-family="Arial" font-size="12" fill="#333">John Tukey: Análisis Exploratorio de Datos</text>
  <text x="320" y="715" font-family="Arial" font-size="12" fill="#666">Visualización y exploración moderna de datos</text>
</svg>