<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Línea vertical base -->
  <line x1="100" y1="50" x2="100" y2="750" stroke="#333" stroke-width="2"/>
  
  <!-- 1886 Galton Regresión -->
  <circle cx="100" cy="100" r="8" fill="#286343"/>
  <text x="60" y="105" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1886</text>
  <line x1="108" y1="100" x2="300" y2="100" stroke="#666" stroke-width="1"/>
  <rect x="300" y="70" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="95" font-family="Arial" font-size="12" fill="#333">Francis Galton: Regresión a la media</text>
  <text x="320" y="115" font-family="Arial" font-size="12" fill="#666">Primera formulación matemática de la regresión</text>

  <!-- 1888 Galton Correlación -->
  <circle cx="100" cy="200" r="8" fill="#286343"/>
  <text x="60" y="205" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1888</text>
  <line x1="108" y1="200" x2="300" y2="200" stroke="#666" stroke-width="1"/>
  <rect x="300" y="170" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="195" font-family="Arial" font-size="12" fill="#333">Francis Galton: Concepto de Correlación</text>
  <text x="320" y="215" font-family="Arial" font-size="12" fill="#666">Introduce el término y concepto de correlación</text>

  <!-- 1893 Pearson -->
  <circle cx="100" cy="300" r="8" fill="#286343"/>
  <text x="60" y="305" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1893</text>
  <line x1="108" y1="300" x2="300" y2="300" stroke="#666" stroke-width="1"/>
  <rect x="300" y="270" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="295" font-family="Arial" font-size="12" fill="#333">Karl Pearson: Fundamentos de Estadística Multivariada</text>
  <text x="320" y="315" font-family="Arial" font-size="12" fill="#666">Introducción de conceptos multivariados modernos</text>

  <!-- 1908 Student -->
  <circle cx="100" cy="400" r="8" fill="#286343"/>
  <text x="60" y="405" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1908</text>
  <line x1="108" y1="400" x2="300" y2="400" stroke="#666" stroke-width="1"/>
  <rect x="300" y="370" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="395" font-family="Arial" font-size="12" fill="#333">William Gosset (Student): Distribución t</text>
  <text x="320" y="415" font-family="Arial" font-size="12" fill="#666">Revolucionó el análisis de muestras pequeñas</text>

  <!-- 1922 Fisher MLE -->
  <circle cx="100" cy="500" r="8" fill="#286343"/>
  <text x="60" y="505" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1922</text>
  <line x1="108" y1="500" x2="300" y2="500" stroke="#666" stroke-width="1"/>
  <rect x="300" y="470" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="495" font-family="Arial" font-size="12" fill="#333">R.A. Fisher: Maximum Likelihood Estimation</text>
  <text x="320" y="515" font-family="Arial" font-size="12" fill="#666">Base de la inferencia estadística moderna</text>

  <!-- 1925 Fisher ANOVA -->
  <circle cx="100" cy="600" r="8" fill="#286343"/>
  <text x="60" y="605" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1925</text>
  <line x1="108" y1="600" x2="300" y2="600" stroke="#666" stroke-width="1"/>
  <rect x="300" y="570" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="595" font-family="Arial" font-size="12" fill="#333">R.A. Fisher: Statistical Methods for Research Workers</text>
  <text x="320" y="615" font-family="Arial" font-size="12" fill="#666">ANOVA y fundamentos de la estadística moderna</text>

  <!-- 1928 Neyman-Pearson -->
  <circle cx="100" cy="700" r="8" fill="#286343"/>
  <text x="60" y="705" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">1928</text>
  <line x1="108" y1="700" x2="300" y2="700" stroke="#666" stroke-width="1"/>
  <rect x="300" y="670" width="450" height="60" rx="5" fill="#f0f9ff" stroke="#286343"/>
  <text x="320" y="695" font-family="Arial" font-size="12" fill="#333">Neyman-Pearson: Teoría de Prueba de Hipótesis</text>
  <text x="320" y="715" font-family="Arial" font-size="12" fill="#666">Framework formal para pruebas estadísticas</text>
</svg>