<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     width="1600" height="900"
     font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <!-- Slide tipografica del acto 2 de la charla COPACO 2026.
       Cierre del acto y antesala del acto 3 sobre sistemas agenticos.
       Tres preguntas sobre replicabilidad seguidas de una frase declarativa.
       Disenio autocontenido con fallback de tipografia al sans del sistema. -->

  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .apertura { font-size: 36px; font-weight: 600; fill: #C2185B; }
      .pregunta { font-size: 26px; font-weight: 500; fill: #1A1A1A; }
      .pregunta-secundaria { font-size: 22px; font-weight: 400; fill: #737373; font-style: italic; }
      .cierre { font-size: 44px; font-weight: 700; fill: #C2185B; letter-spacing: -0.5px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Apertura -->
  <text x="160" y="180" class="apertura">
    Si alguien quisiera replicar este estudio mañana…
  </text>

  <!-- Pregunta 1: codigo -->
  <g transform="translate(160 290)">
    <circle cx="-30" cy="-8" r="5" fill="#C2185B" opacity="0.45"/>
    <text x="0" y="0" class="pregunta">¿Tiene acceso al código?</text>
    <text x="0" y="36" class="pregunta-secundaria">¿O necesita pagar una licencia?</text>
  </g>

  <!-- Pregunta 2: datos -->
  <g transform="translate(160 410)">
    <circle cx="-30" cy="-8" r="5" fill="#C2185B" opacity="0.70"/>
    <text x="0" y="0" class="pregunta">¿Tiene acceso a los datos?</text>
    <text x="0" y="36" class="pregunta-secundaria">¿O quedaron en un disco duro perdido?</text>
  </g>

  <!-- Pregunta 3: versionado -->
  <g transform="translate(160 530)">
    <circle cx="-30" cy="-8" r="5" fill="#C2185B" opacity="1.0"/>
    <text x="0" y="0" class="pregunta">¿Sabe qué versión del software se usó?</text>
    <text x="0" y="36" class="pregunta-secundaria">¿O depende de coincidencias?</text>
  </g>

  <!-- Linea de inflexion sutil -->
  <line x1="160" y1="660" x2="500" y2="660"
        stroke="#C2185B" stroke-width="2" opacity="0.6"/>

  <!-- Frase de cierre -->
  <text x="160" y="760" class="cierre">
    La ciencia es replicable, o no es ciencia.
  </text>

</svg>
