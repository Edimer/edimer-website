<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 700" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Construimos el diagrama de PhenoAssistant: un LLM orquestador que llama a un toolkit curado -->

  <!-- Definimos un marcador de flecha que se orienta tangente al path -->
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#95a5a6"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="1050" height="700" fill="#ffffff"/>

  <!-- ============ TÍTULO ============ -->
  <text x="525" y="55" text-anchor="middle" fill="#34495e" font-size="28" font-weight="600">El laboratorio que habla</text>
  <text x="525" y="86" text-anchor="middle" fill="#7f8c8d" font-size="15" font-weight="300" font-style="italic">PhenoAssistant: un orquestador conversacional para fenotipado vegetal</text>

  <!-- ============ INVESTIGADOR (IZQUIERDA) ============ -->
  <g>
    <!-- Figura humana minimalista -->
    <g transform="translate(95, 340)">
      <circle cx="0" cy="-32" r="14" fill="#2c3e50"/>
      <rect x="-22" y="-15" width="44" height="50" rx="6" fill="#2c3e50"/>
      <rect x="-38" y="-8" width="14" height="36" rx="4" fill="#2c3e50"/>
      <rect x="24" y="-8" width="14" height="36" rx="4" fill="#2c3e50"/>
    </g>
    <text x="95" y="420" text-anchor="middle" fill="#7f8c8d" font-size="12" font-weight="400" letter-spacing="1.5">INVESTIGADOR</text>

    <!-- Bocadillo de diálogo -->
    <g>
      <path d="M 175 270 L 280 270 L 280 320 L 195 320 L 180 335 L 185 320 L 175 320 z" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="227" y="290" text-anchor="middle" fill="#34495e" font-size="12" font-weight="400" font-style="italic">"cuenta las hojas y</text>
      <text x="227" y="307" text-anchor="middle" fill="#34495e" font-size="12" font-weight="400" font-style="italic">grafica el resultado"</text>
    </g>
  </g>

  <!-- ============ FLECHA INVESTIGADOR → ORQUESTADOR ============ -->
  <line x1="305" y1="340" x2="385" y2="340" stroke="#95a5a6" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="345" y="328" text-anchor="middle" fill="#7f8c8d" font-size="10" font-weight="400" font-style="italic">lenguaje natural</text>

  <!-- ============ ORQUESTADOR LLM (CENTRO) ============ -->
  <g>
    <circle cx="465" cy="340" r="72" fill="#ffffff" stroke="#e74c3c" stroke-width="3"/>
    <circle cx="465" cy="340" r="56" fill="#e74c3c"/>
    <text x="465" y="335" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">LLM</text>
    <text x="465" y="358" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="400" letter-spacing="1.5">ORQUESTADOR</text>
  </g>
  <text x="465" y="440" text-anchor="middle" fill="#7f8c8d" font-size="12" font-weight="400" font-style="italic">decide qué tool llamar</text>

  <!-- ============ FLECHAS ORQUESTADOR → TOOLKIT ============ -->
  <g fill="none" stroke="#95a5a6" stroke-width="2.5" marker-end="url(#arrow-gray)">
    <!-- Hacia visión (arriba) -->
    <path d="M 525 305 Q 600 270 660 235"/>
    <!-- Hacia visualización (centro) -->
    <path d="M 537 340 L 660 340"/>
    <!-- Hacia entrenamiento (abajo) -->
    <path d="M 525 375 Q 600 410 660 445"/>
  </g>

  <!-- ============ TOOLKIT (DERECHA CENTRO) ============ -->
  <g>
    <text x="780" y="135" text-anchor="middle" fill="#7f8c8d" font-size="11" font-weight="400" letter-spacing="2">TOOLKIT CURADO</text>
    <line x1="680" y1="148" x2="880" y2="148" stroke="#bdc3c7" stroke-width="1"/>

    <!-- Tool 1: Visión -->
    <g>
      <rect x="665" y="195" width="225" height="76" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
      <!-- Ícono ojo simple -->
      <g transform="translate(695, 233)">
        <ellipse cx="0" cy="0" rx="14" ry="9" fill="none" stroke="#3498db" stroke-width="2"/>
        <circle cx="0" cy="0" r="4" fill="#3498db"/>
      </g>
      <text x="725" y="225" fill="#34495e" font-size="15" font-weight="600">Visión</text>
      <text x="725" y="245" fill="#7f8c8d" font-size="11" font-weight="400">segmentación de hojas</text>
      <text x="725" y="260" fill="#7f8c8d" font-size="11" font-weight="400">conteo, detección</text>
    </g>

    <!-- Tool 2: Visualización -->
    <g>
      <rect x="665" y="300" width="225" height="76" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
      <!-- Ícono mini-chart -->
      <g transform="translate(695, 338)">
        <rect x="-10" y="-2" width="4" height="10" fill="#3498db"/>
        <rect x="-3" y="-8" width="4" height="16" fill="#3498db"/>
        <rect x="4" y="-12" width="4" height="20" fill="#3498db"/>
        <rect x="11" y="-5" width="4" height="13" fill="#3498db"/>
      </g>
      <text x="725" y="330" fill="#34495e" font-size="15" font-weight="600">Visualización</text>
      <text x="725" y="350" fill="#7f8c8d" font-size="11" font-weight="400">gráficos a demanda</text>
      <text x="725" y="365" fill="#7f8c8d" font-size="11" font-weight="400">tablas, boxplots</text>
    </g>

    <!-- Tool 3: Entrenamiento -->
    <g>
      <rect x="665" y="405" width="225" height="76" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
      <!-- Ícono engranaje simplificado -->
      <g transform="translate(695, 443)">
        <circle cx="0" cy="0" r="9" fill="none" stroke="#3498db" stroke-width="2"/>
        <circle cx="0" cy="0" r="3" fill="#3498db"/>
        <line x1="-13" y1="0" x2="-9" y2="0" stroke="#3498db" stroke-width="2"/>
        <line x1="9" y1="0" x2="13" y2="0" stroke="#3498db" stroke-width="2"/>
        <line x1="0" y1="-13" x2="0" y2="-9" stroke="#3498db" stroke-width="2"/>
        <line x1="0" y1="9" x2="0" y2="13" stroke="#3498db" stroke-width="2"/>
      </g>
      <text x="725" y="435" fill="#34495e" font-size="15" font-weight="600">Entrenamiento</text>
      <text x="725" y="455" fill="#7f8c8d" font-size="11" font-weight="400">auto-ML embebido</text>
      <text x="725" y="470" fill="#7f8c8d" font-size="11" font-weight="400">modelos a medida</text>
    </g>
  </g>

  <!-- ============ SALIDA AL INVESTIGADOR (ABAJO) ============ -->
  <g>
    <!-- Flecha de retorno desde el toolkit hacia abajo -->
    <path d="M 778 481 Q 778 535 525 540 Q 270 545 200 470" fill="none" stroke="#16a085" stroke-width="2.5" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
    <text x="525" y="570" text-anchor="middle" fill="#16a085" font-size="12" font-weight="500" font-style="italic">respuestas: imagen segmentada · gráfico · modelo entrenado</text>
  </g>

  <!-- ============ CASOS VALIDADOS (PIE) ============ -->
  <g>
    <rect x="100" y="600" width="850" height="50" rx="6" fill="#f8f9fa" stroke="#ecf0f1" stroke-width="1"/>
    <text x="525" y="622" text-anchor="middle" fill="#7f8c8d" font-size="12" font-weight="400" letter-spacing="1">VALIDADO EN TRES CASOS</text>
    <text x="525" y="641" text-anchor="middle" fill="#34495e" font-size="13" font-weight="500">
      <tspan fill="#e74c3c" font-weight="700">Arabidopsis</tspan>
      <tspan> · hojas de </tspan>
      <tspan fill="#e74c3c" font-weight="700">papa</tspan>
      <tspan> · </tspan>
      <tspan fill="#e74c3c" font-weight="700">trigo</tspan>
      <tspan> de invierno con deficiencias nutricionales</tspan>
    </text>
  </g>

  <!-- Atribución -->
  <text x="525" y="685" text-anchor="middle" fill="#95a5a6" font-size="11" font-weight="300" font-style="italic">Chen et al. · Nature Communications · abril 2026 · DOI: 10.1038/s41467-026-71090-y</text>
</svg>
