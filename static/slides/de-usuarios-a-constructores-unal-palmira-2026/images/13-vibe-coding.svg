<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 700" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Construimos el diagrama de vibe coding: dos familias de agentes que cambian el oficio de programar -->

  <!-- Fondo -->
  <rect width="1050" height="700" fill="#ffffff"/>

  <!-- ============ TÍTULO ============ -->
  <text x="525" y="50" text-anchor="middle" fill="#34495e" font-size="28" font-weight="600">Vibe coding y el oficio de programar</text>
  <text x="525" y="80" text-anchor="middle" fill="#7f8c8d" font-size="15" font-weight="300" font-style="italic">Una práctica nueva y un ecosistema que la habilita</text>

  <!-- ============ CITA DE KARPATHY (BANDA SUPERIOR) ============ -->
  <g>
    <rect x="100" y="105" width="850" height="50" rx="6" fill="#f8f9fa" stroke="#ecf0f1" stroke-width="1"/>
    <text x="525" y="128" text-anchor="middle" fill="#34495e" font-size="13" font-weight="400" font-style="italic">"there's a new kind of coding I call vibe coding,</text>
    <text x="525" y="146" text-anchor="middle" fill="#34495e" font-size="13" font-weight="400" font-style="italic">where you fully give in to the vibes and forget that the code even exists"</text>
  </g>
  <text x="525" y="170" text-anchor="middle" fill="#95a5a6" font-size="11" font-weight="300">— Andrej Karpathy, febrero 2025</text>

  <!-- ============ COLUMNA IZQUIERDA: CODING AGENTS ============ -->
  <g>
    <rect x="40" y="195" width="475" height="370" rx="8" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
    <!-- Banda superior -->
    <rect x="40" y="195" width="475" height="44" rx="8" fill="#3498db"/>
    <rect x="40" y="231" width="475" height="8" fill="#3498db"/>

    <!-- Etiqueta de número -->
    <text x="65" y="223" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1.5">01</text>
    <text x="277" y="223" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Coding agents</text>

    <!-- Subtítulo -->
    <text x="277" y="265" text-anchor="middle" fill="#7f8c8d" font-size="13" font-weight="400" font-style="italic">viven en tu terminal o tu IDE</text>

    <!-- Items: cinco herramientas -->
    <!-- Claude Code -->
    <g>
      <rect x="65" y="290" width="425" height="40" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
      <text x="80" y="315" fill="#e74c3c" font-size="14" font-weight="700">Claude Code</text>
      <text x="475" y="315" text-anchor="end" fill="#7f8c8d" font-size="11" font-style="italic">Anthropic · terminal + VS Code + JetBrains</text>
    </g>
    <!-- Codex -->
    <g>
      <rect x="65" y="335" width="425" height="40" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
      <text x="80" y="360" fill="#e74c3c" font-size="14" font-weight="700">Codex</text>
      <text x="475" y="360" text-anchor="end" fill="#7f8c8d" font-size="11" font-style="italic">OpenAI · terminal y web</text>
    </g>
    <!-- OpenCode -->
    <g>
      <rect x="65" y="380" width="425" height="40" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
      <text x="80" y="405" fill="#e74c3c" font-size="14" font-weight="700">OpenCode</text>
      <text x="475" y="405" text-anchor="end" fill="#7f8c8d" font-size="11" font-style="italic">open source · terminal</text>
    </g>
    <!-- Kilo Code -->
    <g>
      <rect x="65" y="425" width="425" height="40" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
      <text x="80" y="450" fill="#e74c3c" font-size="14" font-weight="700">Kilo Code</text>
      <text x="475" y="450" text-anchor="end" fill="#7f8c8d" font-size="11" font-style="italic">open source · multiplataforma · 500+ modelos</text>
    </g>
    <!-- Pi -->
    <g>
      <rect x="65" y="470" width="425" height="40" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
      <text x="80" y="495" fill="#e74c3c" font-size="14" font-weight="700">Pi</text>
      <text x="475" y="495" text-anchor="end" fill="#7f8c8d" font-size="11" font-style="italic">Earendil · harness minimalista y extensible</text>
    </g>

    <!-- Nota inferior de la columna -->
    <text x="277" y="540" text-anchor="middle" fill="#95a5a6" font-size="11" font-weight="400" font-style="italic">escriben, depuran, refactorizan</text>
    <text x="277" y="555" text-anchor="middle" fill="#95a5a6" font-size="11" font-weight="400" font-style="italic">y ejecutan código por nosotros</text>
  </g>

  <!-- ============ COLUMNA DERECHA: ASISTENTES PERSONALES ============ -->
  <g>
    <rect x="535" y="195" width="475" height="370" rx="8" fill="#ffffff" stroke="#16a085" stroke-width="2"/>
    <!-- Banda superior -->
    <rect x="535" y="195" width="475" height="44" rx="8" fill="#16a085"/>
    <rect x="535" y="231" width="475" height="8" fill="#16a085"/>

    <text x="560" y="223" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1.5">02</text>
    <text x="772" y="223" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Asistentes personales autónomos</text>

    <text x="772" y="265" text-anchor="middle" fill="#7f8c8d" font-size="13" font-weight="400" font-style="italic">viven en tu máquina y te hablan por los canales que ya usas</text>

    <!-- OpenClaw -->
    <g>
      <rect x="560" y="295" width="425" height="100" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
      <text x="580" y="322" fill="#e74c3c" font-size="15" font-weight="700">OpenClaw</text>
      <text x="965" y="322" text-anchor="end" fill="#7f8c8d" font-size="11" font-style="italic">Peter Steinberger · 310k+ stars</text>
      <line x1="580" y1="332" x2="965" y2="332" stroke="#ecf0f1" stroke-width="1"/>
      <text x="580" y="354" fill="#34495e" font-size="12" font-weight="400">conectado a WhatsApp, Telegram, Discord,</text>
      <text x="580" y="372" fill="#34495e" font-size="12" font-weight="400">Slack y 30+ plataformas · skills y memoria</text>
    </g>

    <!-- HermesAgent -->
    <g>
      <rect x="560" y="410" width="425" height="100" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
      <text x="580" y="437" fill="#e74c3c" font-size="15" font-weight="700">Hermes Agent</text>
      <text x="965" y="437" text-anchor="end" fill="#7f8c8d" font-size="11" font-style="italic">Nous Research · #1 en OpenRouter</text>
      <line x1="580" y1="447" x2="965" y2="447" stroke="#ecf0f1" stroke-width="1"/>
      <text x="580" y="469" fill="#34495e" font-size="12" font-weight="400">memoria persistente que aprende de ti</text>
      <text x="580" y="487" fill="#34495e" font-size="12" font-weight="400">mejora con el uso · construye sus propias skills</text>
    </g>

    <!-- Nota inferior -->
    <text x="772" y="540" text-anchor="middle" fill="#95a5a6" font-size="11" font-weight="400" font-style="italic">automatizan tareas más allá del código:</text>
    <text x="772" y="555" text-anchor="middle" fill="#95a5a6" font-size="11" font-weight="400" font-style="italic">correos, calendarios, archivos, navegación</text>
  </g>

  <!-- ============ MENSAJE INFERIOR ============ -->
  <g>
    <rect x="80" y="595" width="890" height="55" rx="6" fill="#f8f9fa" stroke="#ecf0f1" stroke-width="1"/>
    <text x="525" y="620" text-anchor="middle" fill="#34495e" font-size="14" font-weight="500">
      <tspan fill="#7f8c8d" font-style="italic">vibe coding sin auditoría es </tspan>
      <tspan fill="#e74c3c" font-weight="700">el atajo</tspan>
      <tspan fill="#7f8c8d" font-style="italic"> · agentic coding con humanos sincronizados es </tspan>
      <tspan fill="#16a085" font-weight="700">el oficio</tspan>
    </text>
    <text x="525" y="640" text-anchor="middle" fill="#95a5a6" font-size="11" font-weight="300" font-style="italic">la misma herramienta puede ser una cosa o la otra · la diferencia es nuestra</text>
  </g>

  <!-- Atribución -->
  <text x="525" y="685" text-anchor="middle" fill="#95a5a6" font-size="11" font-weight="300" font-style="italic">datos consolidados de sitios oficiales y GitHub · abril–mayo 2026</text>
</svg>
