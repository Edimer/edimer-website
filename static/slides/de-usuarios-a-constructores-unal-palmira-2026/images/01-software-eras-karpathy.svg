<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 700" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Construimos el diagrama de las eras de software propuesto por Karpathy -->

  <!-- Fondo -->
  <rect width="1050" height="700" fill="#ffffff"/>

  <!-- Línea temporal de referencia -->
  <line x1="80" y1="600" x2="970" y2="600" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="3,5"/>
  <text x="525" y="650" text-anchor="middle" fill="#95a5a6" font-size="14" font-weight="300" font-style="italic">Evolución del oficio de programar</text>

  <!-- ============ SOFTWARE 1.0 ============ -->
  <g>
    <!-- Bloque -->
    <rect x="100" y="180" width="240" height="360" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
    <!-- Banda superior -->
    <rect x="100" y="180" width="240" height="50" rx="6" fill="#2c3e50"/>
    <rect x="100" y="222" width="240" height="8" fill="#2c3e50"/>

    <!-- Título -->
    <text x="220" y="213" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="600">Software 1.0</text>

    <!-- Descripción principal -->
    <text x="220" y="270" text-anchor="middle" fill="#34495e" font-size="16" font-weight="400">Código escrito por</text>
    <text x="220" y="293" text-anchor="middle" fill="#e74c3c" font-size="20" font-weight="700">humanos</text>

    <!-- Línea separadora interna -->
    <line x1="130" y1="320" x2="310" y2="320" stroke="#ecf0f1" stroke-width="1.5"/>

    <!-- Lenguaje -->
    <text x="220" y="355" text-anchor="middle" fill="#7f8c8d" font-size="13" font-weight="400" letter-spacing="1">LENGUAJE</text>
    <text x="220" y="385" text-anchor="middle" fill="#2c3e50" font-size="18" font-weight="400" font-style="italic">Python, C, Java...</text>

    <!-- Ejemplo -->
    <text x="220" y="435" text-anchor="middle" fill="#7f8c8d" font-size="13" font-weight="400" letter-spacing="1">EJEMPLO</text>
    <g font-family="Courier New, monospace" font-size="13" fill="#16a085">
      <text x="135" y="465">def predict(x):</text>
      <text x="135" y="485">  return w * x + b</text>
    </g>

    <!-- Año/era -->
    <circle cx="220" cy="600" r="9" fill="#2c3e50"/>
    <text x="220" y="585" text-anchor="middle" fill="#34495e" font-size="13" font-weight="400">desde ~1950</text>
  </g>

  <!-- Flecha 1 -->
  <g>
    <line x1="350" y1="360" x2="395" y2="360" stroke="#95a5a6" stroke-width="2.5"/>
    <polygon points="395,355 405,360 395,365" fill="#95a5a6"/>
  </g>

  <!-- ============ SOFTWARE 2.0 ============ -->
  <g>
    <!-- Bloque -->
    <rect x="415" y="160" width="240" height="380" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
    <!-- Banda superior -->
    <rect x="415" y="160" width="240" height="50" rx="6" fill="#3498db"/>
    <rect x="415" y="202" width="240" height="8" fill="#3498db"/>

    <!-- Título -->
    <text x="535" y="193" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="600">Software 2.0</text>

    <!-- Descripción principal -->
    <text x="535" y="250" text-anchor="middle" fill="#34495e" font-size="16" font-weight="400">Pesos aprendidos por</text>
    <text x="535" y="273" text-anchor="middle" fill="#e74c3c" font-size="20" font-weight="700">redes neuronales</text>

    <!-- Línea separadora interna -->
    <line x1="445" y1="300" x2="625" y2="300" stroke="#ecf0f1" stroke-width="1.5"/>

    <!-- Lenguaje -->
    <text x="535" y="335" text-anchor="middle" fill="#7f8c8d" font-size="13" font-weight="400" letter-spacing="1">LENGUAJE</text>
    <text x="535" y="365" text-anchor="middle" fill="#2c3e50" font-size="18" font-weight="400" font-style="italic">Datos + gradientes</text>

    <!-- Ejemplo -->
    <text x="535" y="415" text-anchor="middle" fill="#7f8c8d" font-size="13" font-weight="400" letter-spacing="1">EJEMPLO</text>
    <text x="535" y="445" text-anchor="middle" fill="#16a085" font-size="14" font-weight="400" font-style="italic">CNN, ResNet,</text>
    <text x="535" y="465" text-anchor="middle" fill="#16a085" font-size="14" font-weight="400" font-style="italic">redes para visión</text>

    <!-- Año/era -->
    <circle cx="535" cy="600" r="9" fill="#3498db"/>
    <text x="535" y="585" text-anchor="middle" fill="#34495e" font-size="13" font-weight="400">desde ~2012</text>
  </g>

  <!-- Flecha 2 -->
  <g>
    <line x1="665" y1="360" x2="710" y2="360" stroke="#95a5a6" stroke-width="2.5"/>
    <polygon points="710,355 720,360 710,365" fill="#95a5a6"/>
  </g>

  <!-- ============ SOFTWARE 3.0 ============ -->
  <g>
    <!-- Bloque con énfasis (más alto, borde rojo) -->
    <rect x="730" y="140" width="240" height="400" rx="6" fill="#ffffff" stroke="#e74c3c" stroke-width="3"/>
    <!-- Banda superior -->
    <rect x="730" y="140" width="240" height="50" rx="6" fill="#e74c3c"/>
    <rect x="730" y="182" width="240" height="8" fill="#e74c3c"/>

    <!-- Título -->
    <text x="850" y="173" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="600">Software 3.0</text>

    <!-- Descripción principal -->
    <text x="850" y="230" text-anchor="middle" fill="#34495e" font-size="16" font-weight="400">LLMs programados con</text>
    <text x="850" y="253" text-anchor="middle" fill="#e74c3c" font-size="20" font-weight="700">lenguaje natural</text>

    <!-- Línea separadora interna -->
    <line x1="760" y1="280" x2="940" y2="280" stroke="#ecf0f1" stroke-width="1.5"/>

    <!-- Lenguaje -->
    <text x="850" y="315" text-anchor="middle" fill="#7f8c8d" font-size="13" font-weight="400" letter-spacing="1">LENGUAJE</text>
    <text x="850" y="345" text-anchor="middle" fill="#2c3e50" font-size="18" font-weight="400" font-style="italic">Inglés (¡o español!)</text>

    <!-- Ejemplo -->
    <text x="850" y="395" text-anchor="middle" fill="#7f8c8d" font-size="13" font-weight="400" letter-spacing="1">EJEMPLO</text>
    <text x="850" y="425" text-anchor="middle" fill="#16a085" font-size="14" font-weight="400" font-style="italic">"Analiza este protocolo</text>
    <text x="850" y="445" text-anchor="middle" fill="#16a085" font-size="14" font-weight="400" font-style="italic">y propón mejoras"</text>

    <!-- Badge "estamos aquí" -->
    <rect x="785" y="475" width="130" height="32" rx="16" fill="#e74c3c"/>
    <text x="850" y="496" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600" letter-spacing="1">ESTAMOS AQUÍ</text>

    <!-- Año/era -->
    <circle cx="850" cy="600" r="9" fill="#e74c3c"/>
    <text x="850" y="585" text-anchor="middle" fill="#34495e" font-size="13" font-weight="400">desde ~2023</text>
  </g>

  <!-- Atribución -->
  <text x="525" y="685" text-anchor="middle" fill="#95a5a6" font-size="12" font-weight="300" font-style="italic">Adaptado de Andrej Karpathy — Software is Changing (Again), Y Combinator AI Startup School, junio 2025</text>
</svg>
