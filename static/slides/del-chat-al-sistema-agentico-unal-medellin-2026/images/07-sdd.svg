<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 700" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Dibujamos el flujo de Spec-Driven Development: la especificación es la fuente de verdad antes del código -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#95a5a6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a085"/>
    </marker>
  </defs>

  <rect width="1050" height="700" fill="#ffffff"/>

  <text x="525" y="55" text-anchor="middle" fill="#34495e" font-size="28" font-weight="600">SDD: primero la especificación, después el código</text>
  <text x="525" y="86" text-anchor="middle" fill="#7f8c8d" font-size="15" font-weight="300" font-style="italic">Spec-Driven Development: la spec es la fuente de verdad para ti y para el agente</text>

  <!-- ============ FLUJO ============ -->
  <g text-anchor="middle">
    <!-- 1 idea -->
    <rect x="40" y="150" width="150" height="110" rx="8" fill="#ffffff" stroke="#95a5a6" stroke-width="2"/>
    <text x="115" y="190" fill="#95a5a6" font-size="12" font-weight="700" letter-spacing="1.5">IDEA</text>
    <text x="115" y="218" fill="#34495e" font-size="13">"¿cómo cambia la</text>
    <text x="115" y="236" fill="#34495e" font-size="13">leche por raza?"</text>

    <!-- 2 spec -->
    <rect x="240" y="150" width="170" height="110" rx="8" fill="#ffffff" stroke="#3498db" stroke-width="2.5"/>
    <text x="325" y="182" fill="#3498db" font-size="12" font-weight="700" letter-spacing="1.5">ESPECIFICAR</text>
    <text x="325" y="208" fill="#34495e" font-size="13" font-weight="600">qué y por qué</text>
    <text x="325" y="230" fill="#7f8c8d" font-size="12">requisitos</text>
    <text x="325" y="247" fill="#7f8c8d" font-size="12">criterios de aceptación</text>

    <!-- 3 diseño -->
    <rect x="460" y="150" width="170" height="110" rx="8" fill="#ffffff" stroke="#3498db" stroke-width="2.5"/>
    <text x="545" y="182" fill="#3498db" font-size="12" font-weight="700" letter-spacing="1.5">DISEÑAR</text>
    <text x="545" y="208" fill="#34495e" font-size="13" font-weight="600">cómo</text>
    <text x="545" y="230" fill="#7f8c8d" font-size="12">módulos, contratos</text>
    <text x="545" y="247" fill="#7f8c8d" font-size="12">datos, decisiones</text>

    <!-- 4 tareas -->
    <rect x="680" y="150" width="150" height="110" rx="8" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
    <text x="755" y="182" fill="#34495e" font-size="12" font-weight="700" letter-spacing="1.5">TAREAS</text>
    <text x="755" y="208" fill="#34495e" font-size="13" font-weight="600">pasos pequeños</text>
    <text x="755" y="230" fill="#7f8c8d" font-size="12">verificables</text>
    <text x="755" y="247" fill="#7f8c8d" font-size="12">uno a la vez</text>

    <!-- 5 implementar -->
    <rect x="880" y="150" width="130" height="110" rx="8" fill="#e74c3c"/>
    <text x="945" y="190" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1.5">AGENTE</text>
    <text x="945" y="216" fill="#ffffff" font-size="13" font-weight="600">implementa</text>
    <text x="945" y="238" fill="#ffffff" font-size="12">y prueba</text>
  </g>
  <g fill="none" stroke="#95a5a6" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 193 205 L 236 205"/>
    <path d="M 413 205 L 456 205"/>
    <path d="M 633 205 L 676 205"/>
    <path d="M 833 205 L 876 205"/>
  </g>

  <!-- Bucle de vuelta: la spec se actualiza -->
  <path d="M 945 265 Q 945 340 650 340 Q 360 340 330 268" fill="none" stroke="#16a085" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="640" y="365" text-anchor="middle" fill="#16a085" font-size="13" font-style="italic">lo aprendido actualiza la spec, no solo el código</text>

  <!-- Llave superior: aquí vive SYSTEM_DESIGN.md -->
  <path d="M 245 144 L 245 134 L 625 134 L 625 144" fill="none" stroke="#3498db" stroke-width="1.5"/>
  <text x="435" y="126" text-anchor="middle" fill="#3498db" font-size="13" font-weight="600">aquí vive SYSTEM_DESIGN.md</text>

  <!-- ============ HERRAMIENTAS ============ -->
  <text x="525" y="410" text-anchor="middle" fill="#7f8c8d" font-size="11" font-weight="700" letter-spacing="1.5">ASÍ LO MATERIALIZAN ALGUNAS HERRAMIENTAS</text>
  <g>
    <rect x="95" y="425" width="400" height="95" rx="8" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="295" y="452" text-anchor="middle" fill="#34495e" font-size="15" font-weight="600">GitHub Spec Kit</text>
    <text x="295" y="478" text-anchor="middle" fill="#34495e" font-size="12" font-family="Menlo, Consolas, monospace">constitution.md → spec.md → plan.md</text>
    <text x="295" y="498" text-anchor="middle" fill="#34495e" font-size="12" font-family="Menlo, Consolas, monospace">→ tasks.md → implement</text>

    <rect x="555" y="425" width="400" height="95" rx="8" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="755" y="452" text-anchor="middle" fill="#34495e" font-size="15" font-weight="600">Kiro (AWS)</text>
    <text x="755" y="478" text-anchor="middle" fill="#34495e" font-size="12" font-family="Menlo, Consolas, monospace">requirements.md → design.md</text>
    <text x="755" y="498" text-anchor="middle" fill="#34495e" font-size="12" font-family="Menlo, Consolas, monospace">→ tasks.md</text>
  </g>

  <!-- ============ NIVELES (Fowler / Böckeler) ============ -->
  <g text-anchor="middle" font-size="13">
    <rect x="95" y="550" width="270" height="44" rx="22" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="230" y="577" fill="#34495e"><tspan font-weight="700">spec-first</tspan> · para la tarea</text>
    <rect x="390" y="550" width="270" height="44" rx="22" fill="#f8f9fa" stroke="#16a085" stroke-width="1.5"/>
    <text x="525" y="577" fill="#34495e"><tspan font-weight="700" fill="#16a085">spec-anchored</tspan> · se mantiene</text>
    <rect x="685" y="550" width="270" height="44" rx="22" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="820" y="577" fill="#34495e"><tspan font-weight="700">spec-as-source</tspan> · todo sale de ella</text>
  </g>

  <text x="525" y="635" text-anchor="middle" fill="#7f8c8d" font-size="13" font-style="italic">una práctica emergente, no un estándar cerrado: tómalo como disciplina, no como dogma</text>
</svg>
