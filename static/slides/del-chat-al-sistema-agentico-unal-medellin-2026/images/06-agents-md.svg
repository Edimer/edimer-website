<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 700" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Mostramos un AGENTS.md de ejemplo y qué herramientas lo leen -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#95a5a6"/>
    </marker>
  </defs>

  <rect width="1050" height="700" fill="#ffffff"/>

  <text x="525" y="55" text-anchor="middle" fill="#34495e" font-size="28" font-weight="600">AGENTS.md: el README para agentes</text>
  <text x="525" y="86" text-anchor="middle" fill="#7f8c8d" font-size="15" font-weight="300" font-style="italic">Markdown plano en la raíz del repositorio · sin campos obligatorios</text>

  <!-- ============ ARCHIVO DE EJEMPLO ============ -->
  <rect x="50" y="115" width="520" height="470" rx="8" fill="#ffffff" stroke="#16a085" stroke-width="2"/>
  <rect x="50" y="115" width="520" height="36" rx="8" fill="#16a085"/>
  <rect x="50" y="143" width="520" height="8" fill="#16a085"/>
  <text x="72" y="139" fill="#ffffff" font-size="13" font-weight="600" font-family="Menlo, Consolas, monospace">AGENTS.md</text>
  <text x="550" y="139" text-anchor="end" fill="#ffffff" font-size="11" font-style="italic">ejemplo para adaptar</text>

  <g font-family="Menlo, Consolas, monospace" font-size="12.5">
    <text x="72" y="180" fill="#16a085" font-weight="700"># Proyecto</text>
    <text x="72" y="200" fill="#34495e">Informe semanal en R + Quarto sobre la</text>
    <text x="72" y="220" fill="#34495e">producción de leche. Diseño en</text>
    <text x="72" y="240" fill="#34495e">SYSTEM_DESIGN.md: léelo antes de cambiar código.</text>

    <text x="72" y="275" fill="#16a085" font-weight="700"># Comandos</text>
    <text x="72" y="295" fill="#34495e">- probar:  Rscript -e "testthat::test_dir('tests')"</text>
    <text x="72" y="315" fill="#34495e">- informe: quarto render informe.qmd</text>

    <text x="72" y="350" fill="#16a085" font-weight="700"># Convenciones</text>
    <text x="72" y="370" fill="#34495e">- datos/ (.xlsx de cada semana): nunca se modifican</text>
    <text x="72" y="390" fill="#34495e">- funciones en R/, pruebas en tests/</text>

    <text x="72" y="425" fill="#16a085" font-weight="700"># Flujo</text>
    <text x="72" y="445" fill="#34495e">- si falta un paquete o Quarto, instálalo</text>
    <text x="72" y="465" fill="#34495e">  y dime qué instalaste</text>

    <text x="72" y="500" fill="#e74c3c" font-weight="700"># Límites</text>
    <text x="72" y="520" fill="#34495e">- nunca secretos en archivos ni respuestas</text>
    <text x="72" y="540" fill="#34495e">- no inventar datos ni resultados</text>
    <text x="72" y="560" fill="#34495e">- pedir aprobación antes de borrar</text>
  </g>

  <!-- ============ QUIÉN LO LEE ============ -->
  <text x="800" y="135" text-anchor="middle" fill="#7f8c8d" font-size="11" font-weight="700" letter-spacing="1.5">LO LEEN, ENTRE OTROS</text>
  <g font-size="13" fill="#34495e" text-anchor="middle">
    <rect x="620" y="152" width="170" height="34" rx="17" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="705" y="174" font-weight="600">Hermes Agent</text>
    <rect x="810" y="152" width="170" height="34" rx="17" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="895" y="174">Codex</text>
    <rect x="620" y="198" width="170" height="34" rx="17" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="705" y="220">Cursor</text>
    <rect x="810" y="198" width="170" height="34" rx="17" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="895" y="220">GitHub Copilot</text>
    <rect x="620" y="244" width="170" height="34" rx="17" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="705" y="266">Kiro</text>
    <rect x="810" y="244" width="170" height="34" rx="17" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="895" y="266">Gemini CLI*</text>
    <rect x="620" y="290" width="360" height="34" rx="17" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="800" y="312">Claude Code (desde v2.1.277, si no hay CLAUDE.md)</text>
  </g>
  <text x="800" y="345" text-anchor="middle" fill="#95a5a6" font-size="11" font-style="italic">* requiere una línea de configuración</text>

  <!-- Cifras -->
  <rect x="620" y="375" width="360" height="90" rx="8" fill="#f8f9fa" stroke="#ecf0f1"/>
  <text x="800" y="415" text-anchor="middle" fill="#e74c3c" font-size="30" font-weight="700">+60.000</text>
  <text x="800" y="445" text-anchor="middle" fill="#34495e" font-size="13">proyectos de código abierto lo usan</text>

  <rect x="620" y="478" width="360" height="114" rx="8" fill="#ffffff" stroke="#8b2635" stroke-width="1.5"/>
  <text x="800" y="505" text-anchor="middle" fill="#8b2635" font-size="12" font-weight="700" letter-spacing="1.5">LO QUE NO ES</text>
  <text x="800" y="531" text-anchor="middle" fill="#34495e" font-size="13">no reemplaza las pruebas</text>
  <text x="800" y="553" text-anchor="middle" fill="#34495e" font-size="13">no guarda secretos</text>
  <text x="800" y="575" text-anchor="middle" fill="#34495e" font-size="13">no es una barrera de seguridad</text>

  <text x="525" y="630" text-anchor="middle" fill="#34495e" font-size="15">escríbelo una vez: <tspan font-weight="700" fill="#16a085">cualquier agente</tspan> que abra el repositorio trabaja con tus reglas</text>
</svg>
