<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 700" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Mostramos las partes de un sistema agéntico, con Hermes Agent como ejemplo, en lenguaje simple -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#95a5a6"/>
    </marker>
  </defs>

  <rect width="1050" height="700" fill="#ffffff"/>

  <text x="525" y="55" text-anchor="middle" fill="#34495e" font-size="28" font-weight="600">Anatomía de un sistema agéntico</text>
  <text x="525" y="86" text-anchor="middle" fill="#7f8c8d" font-size="15" font-weight="300" font-style="italic">Ejemplo: Hermes Agent, de Nous Research (código abierto)</text>

  <!-- ============ ENTRADAS (izquierda) ============ -->
  <text x="130" y="140" text-anchor="middle" fill="#7f8c8d" font-size="11" letter-spacing="1.5">TÚ LE HABLAS DESDE</text>
  <g font-size="13" fill="#34495e">
    <rect x="60" y="160" width="140" height="34" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="130" y="182" text-anchor="middle" font-weight="600">app de escritorio</text>
    <rect x="60" y="205" width="140" height="34" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="130" y="227" text-anchor="middle">terminal</text>
    <rect x="60" y="250" width="140" height="34" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
    <text x="130" y="272" text-anchor="middle">Telegram, Slack…</text>
  </g>
  <path d="M 205 222 L 345 222" fill="none" stroke="#95a5a6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ BUCLE (centro) ============ -->
  <rect x="355" y="130" width="340" height="190" rx="10" fill="#ffffff" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="525" y="157" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="700" letter-spacing="1.5">EL CICLO DE TRABAJO</text>
  <g font-size="12" fill="#34495e" text-anchor="middle">
    <rect x="380" y="177" width="130" height="32" rx="16" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="445" y="198">lee tu pedido</text>
    <rect x="540" y="177" width="130" height="32" rx="16" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="605" y="198">consulta el modelo</text>
    <rect x="540" y="265" width="130" height="32" rx="16" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="605" y="286">actúa</text>
    <rect x="380" y="265" width="130" height="32" rx="16" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="445" y="286">revisa y repite</text>
  </g>
  <g fill="none" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 512 193 L 536 193"/>
    <path d="M 605 212 L 605 261"/>
    <path d="M 538 281 L 514 281"/>
    <path d="M 445 262 L 445 213"/>
  </g>

  <!-- ============ MODELO (derecha) ============ -->
  <path d="M 700 215 L 830 215" fill="none" stroke="#95a5a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 830 232 L 700 232" fill="none" stroke="#95a5a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="915" cy="223" r="75" fill="#e74c3c"/>
  <text x="915" y="216" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">LLM</text>
  <text x="915" y="238" text-anchor="middle" fill="#ffffff" font-size="11" letter-spacing="1">vía OpenRouter</text>
  <text x="915" y="320" text-anchor="middle" fill="#7f8c8d" font-size="12" font-style="italic">razona y decide</text>

  <!-- ============ TRES CAPACIDADES ============ -->
  <path d="M 525 324 L 525 350" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="185" y1="350" x2="865" y2="350" stroke="#95a5a6" stroke-width="2" stroke-dasharray="4,3"/>
  <g>
    <rect x="70" y="360" width="290" height="135" rx="8" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
    <rect x="70" y="360" width="290" height="38" rx="8" fill="#3498db"/>
    <rect x="70" y="390" width="290" height="8" fill="#3498db"/>
    <text x="215" y="385" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">herramientas: actúa</text>
    <text x="215" y="428" text-anchor="middle" fill="#34495e" font-size="13">lee y escribe archivos</text>
    <text x="215" y="452" text-anchor="middle" fill="#34495e" font-size="13">ejecuta R en la terminal</text>
    <text x="215" y="476" text-anchor="middle" fill="#34495e" font-size="13">busca en la web</text>

    <rect x="380" y="360" width="290" height="135" rx="8" fill="#ffffff" stroke="#16a085" stroke-width="2"/>
    <rect x="380" y="360" width="290" height="38" rx="8" fill="#16a085"/>
    <rect x="380" y="390" width="290" height="8" fill="#16a085"/>
    <text x="525" y="385" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">contexto: recuerda</text>
    <text x="525" y="428" text-anchor="middle" fill="#34495e" font-size="13">lee el AGENTS.md del proyecto</text>
    <text x="525" y="452" text-anchor="middle" fill="#34495e" font-size="13">guarda notas entre sesiones</text>
    <text x="525" y="476" text-anchor="middle" fill="#34495e" font-size="13">busca en conversaciones pasadas</text>

    <rect x="690" y="360" width="290" height="135" rx="8" fill="#ffffff" stroke="#8b2635" stroke-width="2"/>
    <rect x="690" y="360" width="290" height="38" rx="8" fill="#8b2635"/>
    <rect x="690" y="390" width="290" height="8" fill="#8b2635"/>
    <text x="835" y="385" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">controles: protege</text>
    <text x="835" y="428" text-anchor="middle" fill="#34495e" font-size="13">pide permiso antes de</text>
    <text x="835" y="452" text-anchor="middle" fill="#34495e" font-size="13">comandos riesgosos</text>
    <text x="835" y="476" text-anchor="middle" fill="#34495e" font-size="13">bloquea lo destructivo</text>
  </g>

  <!-- ============ PARA EXPLORAR DESPUÉS ============ -->
  <rect x="70" y="520" width="910" height="95" rx="8" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="525" y="546" text-anchor="middle" fill="#7f8c8d" font-size="11" font-weight="700" letter-spacing="1.5">PARA EXPLORAR DESPUÉS DEL TALLER</text>
  <g font-size="13" text-anchor="middle">
    <rect x="95" y="562" width="160" height="36" rx="18" fill="#ffffff" stroke="#34495e" stroke-width="1.2"/>
    <text x="175" y="585" fill="#34495e"><tspan font-weight="700">skills</tspan> · recetas</text>
    <rect x="270" y="562" width="185" height="36" rx="18" fill="#ffffff" stroke="#34495e" stroke-width="1.2"/>
    <text x="362" y="585" fill="#34495e"><tspan font-weight="700">MCP</tspan> · conectores</text>
    <rect x="470" y="562" width="185" height="36" rx="18" fill="#ffffff" stroke="#34495e" stroke-width="1.2"/>
    <text x="562" y="585" fill="#34495e"><tspan font-weight="700">Context7</tspan> · docs al día</text>
    <rect x="670" y="562" width="140" height="36" rx="18" fill="#ffffff" stroke="#34495e" stroke-width="1.2"/>
    <text x="740" y="585" fill="#34495e"><tspan font-weight="700">subagentes</tspan></text>
    <rect x="825" y="562" width="130" height="36" rx="18" fill="#ffffff" stroke="#34495e" stroke-width="1.2"/>
    <text x="890" y="585" fill="#34495e"><tspan font-weight="700">cron</tspan> · rutinas</text>
  </g>

  <text x="525" y="660" text-anchor="middle" fill="#34495e" font-size="15">el modelo <tspan font-weight="700" fill="#e74c3c">razona</tspan> · el sistema <tspan font-weight="700">organiza</tspan> · las herramientas <tspan font-weight="700" fill="#3498db">ejecutan</tspan></text>
</svg>
